<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a41">
<title>국가자격시험 AI 학습 프로그램</title>
<style>
  :root{
    --navy:#1b2a41;
    --navy-2:#243b55;
    --paper:#f7f5f0;
    --paper-2:#eeece4;
    --ink:#26282b;
    --line:#d9d5c8;
    --accent:#b5651d;
    --accent-2:#8a4b12;
    --ok:#2f6f4f;
    --bad:#a5342b;
    --card-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.55;
  }
  header{
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#f2efe6;
    padding:22px 24px;
    border-bottom:4px solid var(--accent);
  }
  header h1{margin:0;font-size:1.35rem;letter-spacing:.2px;}
  header p{margin:6px 0 0;font-size:.85rem;color:#c9d2de;}
  .layout{
    display:flex;
    min-height:calc(100vh - 92px);
  }
  nav.sidebar{
    width:280px;
    background:var(--paper-2);
    border-right:1px solid var(--line);
    padding:16px;
    overflow-y:auto;
  }
  nav.sidebar h2{
    font-size:.78rem;
    color:#6b6656;
    margin:18px 0 8px;
    padding-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  nav.sidebar h2:first-child{margin-top:0;}
  .cert-btn{
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:9px 10px;
    margin-bottom:6px;
    font-size:.87rem;
    cursor:pointer;
    color:var(--ink);
  }
  .cert-btn.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }
  .cert-btn small{display:block;color:#888;font-size:.72rem;margin-top:2px;}
  .cert-btn.active small{color:#c9d2de;}
  .global-btn{
    display:block;width:100%;text-align:left;
    background:var(--accent);color:#fff;border:none;border-radius:4px;
    padding:10px;margin-bottom:14px;font-size:.85rem;cursor:pointer;
  }
  main{
    flex:1;
    padding:26px 32px;
    overflow-y:auto;
    max-width:920px;
  }
  .breadcrumb{font-size:.78rem;color:#8a8570;margin-bottom:14px;}
  .type-tabs, .subject-tabs, .mode-tabs{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;
  }
  .tab-btn{
    background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:7px 16px;font-size:.83rem;cursor:pointer;
  }
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .subject-tabs .tab-btn{border-radius:4px;}
  h2.subject-title{margin:6px 0 2px;font-size:1.15rem;}
  .subject-meta{font-size:.78rem;color:#8a8570;margin-bottom:16px;}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:18px 20px;margin-bottom:14px;box-shadow:var(--card-shadow);
  }
  .flash{
    min-height:120px;display:flex;align-items:center;justify-content:center;
    text-align:center;cursor:pointer;font-size:1.02rem;padding:24px 18px;
  }
  .flash .tag{position:absolute;font-size:.7rem;color:#aaa;}
  .flash-wrap{position:relative;}
  .flash-nav{display:flex;justify-content:space-between;margin-top:8px;}
  .flash-nav button{
    background:var(--navy);color:#fff;border:none;border-radius:4px;
    padding:8px 14px;cursor:pointer;font-size:.82rem;
  }
  .flash-counter{font-size:.8rem;color:#8a8570;align-self:center;}
  .q-tag{
    display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;
    background:var(--paper-2);color:#6b6656;margin-bottom:8px;
  }
  .q-text{font-weight:600;margin:6px 0 12px;}
  .choice{
    display:block;width:100%;text-align:left;background:#fbfaf7;
    border:1px solid var(--line);border-radius:4px;padding:9px 12px;
    margin-bottom:7px;cursor:pointer;font-size:.9rem;
  }
  .choice:hover{border-color:var(--accent);}
  .choice.correct{background:#e6f2ea;border-color:var(--ok);color:var(--ok);font-weight:600;}
  .choice.wrong{background:#f8e9e7;border-color:var(--bad);color:var(--bad);font-weight:600;}
  .explain{
    margin-top:10px;padding:10px 12px;background:#fbf6ec;border-left:3px solid var(--accent);
    font-size:.85rem;display:none;
  }
  .explain.show{display:block;}
  .diagram-box{
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:10px;margin-bottom:10px;text-align:center;
  }
  .diagram-box svg{max-width:100%;height:auto;display:block;margin:0 auto;}
  .diagram-caption{font-size:.72rem;color:#8a8570;margin-top:6px;}
  .essay-badge{
    display:inline-block;font-size:.72rem;color:#8a5a1d;background:#fbf1e0;
    border:1px solid #e8d4ad;border-radius:10px;padding:3px 10px;margin-bottom:8px;
  }
  .essay-textarea{
    width:100%;min-height:110px;box-sizing:border-box;margin:8px 0 10px;
    padding:10px 12px;border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:.88rem;resize:vertical;background:#fff;
  }
  .essay-compare{
    display:none;gap:14px;margin-top:12px;
  }
  .essay-compare.show{display:flex;flex-wrap:wrap;}
  .essay-col{
    flex:1;min-width:220px;background:#fbf6ec;border-radius:6px;padding:12px 14px;
    border-left:3px solid var(--accent);
  }
  .essay-col-mine{border-left-color:#8a8570;background:#f6f5f0;}
  .essay-col-title{font-size:.8rem;font-weight:600;margin-bottom:6px;color:#6b6656;}
  .essay-col-body{font-size:.85rem;white-space:pre-wrap;line-height:1.55;}
  @media (max-width:700px){
    .essay-compare{flex-direction:column;}
  }
  .q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .status-pill{font-size:.72rem;padding:2px 8px;border-radius:10px;}
  .status-pill.wrong{background:#f8e9e7;color:var(--bad);}
  .status-pill.correct{background:#e6f2ea;color:var(--ok);}
  .status-pill.new{background:var(--paper-2);color:#8a8570;}
  .empty-state{
    text-align:center;padding:50px 20px;color:#8a8570;font-size:.92rem;
  }
  .warn-box{
    background:#fbf6ec;border:1px solid #e3d6b5;border-radius:6px;
    padding:12px 14px;font-size:.82rem;color:#6b5a2c;margin-bottom:16px;
  }
  .plan-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px;}
  .plan-box h3{margin:0 0 10px;font-size:1rem;color:var(--navy);}
  .plan-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0;font-size:.88rem;}
  .plan-row input{padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:.9rem;font-family:inherit;}
  .plan-row input[type=number]{width:80px;}
  .plan-start-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 22px;font-size:.92rem;font-weight:600;cursor:pointer;}
  .plan-stats{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 4px;}
  .plan-stat{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:.8rem;color:#6b6656;}
  .plan-stat b{display:block;font-size:1.15rem;color:var(--navy);margin-top:2px;}
  .plan-dday{color:var(--accent) !important;}
  .plan-note{font-size:.76rem;color:#8a8570;margin-top:8px;line-height:1.5;}
  .tab-btn.plan-tab{border-color:var(--accent);color:var(--accent);font-weight:600;}
  .tab-btn.plan-tab.active{background:var(--accent);color:#fff;}
  .placeholder-box{
    background:#fff;border:1px dashed var(--line);border-radius:6px;
    padding:22px;text-align:center;color:#8a8570;font-size:.87rem;
  }
  .score-bar{
    display:flex;gap:16px;margin-bottom:16px;font-size:.85rem;
  }
  .score-bar div{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 14px;}
  .reset-btn{
    background:none;border:1px solid var(--line);border-radius:4px;
    padding:6px 12px;font-size:.78rem;cursor:pointer;color:#8a8570;margin-top:10px;
  }
  .exam-intro{
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:28px 22px;text-align:center;
  }
  .exam-intro h3{margin:0 0 10px;font-size:1.05rem;color:var(--navy);}
  .exam-intro p{font-size:.85rem;color:#6b6656;margin:6px 0 18px;}
  .exam-start-btn{
    background:var(--accent);color:#fff;border:none;border-radius:6px;
    padding:12px 28px;font-size:.95rem;font-weight:600;cursor:pointer;
  }
  .exam-progress{
    display:flex;justify-content:space-between;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:10px 16px;margin-bottom:14px;font-size:.85rem;position:sticky;top:0;
  }
  .exam-submit-btn{
    background:var(--navy);color:#fff;border:none;border-radius:6px;
    padding:10px 22px;font-size:.9rem;font-weight:600;cursor:pointer;
  }
  .choice.exam-selected{border-color:var(--accent);background:#fbf1e6;font-weight:600;}
  .exam-result-banner{
    border-radius:8px;padding:18px 20px;margin-bottom:16px;text-align:center;
  }
  .exam-result-banner.pass{background:#e6f2ea;border:1px solid var(--ok);}
  .exam-result-banner.fail{background:#f8e9e7;border:1px solid var(--bad);}
  .exam-result-banner .score-num{font-size:1.8rem;font-weight:700;margin:4px 0;}
  .exam-result-banner.pass .score-num{color:var(--ok);}
  .exam-result-banner.fail .score-num{color:var(--bad);}
  .exam-result-banner .pf-label{font-size:1.1rem;font-weight:700;}
  .exam-result-banner.pass .pf-label{color:var(--ok);}
  .exam-result-banner.fail .pf-label{color:var(--bad);}
  .exam-result-banner .exam-note{font-size:.75rem;color:#8a8570;margin-top:8px;}
  footer{
    padding:14px 24px;font-size:.72rem;color:#8a8570;border-top:1px solid var(--line);
    background:var(--paper-2);
  }
  @media (max-width:800px){
    .layout{flex-direction:column;}
    nav.sidebar{width:100%;max-height:42vh;border-right:none;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;}
    main{padding:14px 12px;}
    header{padding:16px 14px;}
    header h1{font-size:1.15rem;}
    .cert-btn,.global-btn,.tab-btn,.flash-nav button,.plan-start-btn,.choice,.exam-start-btn,.exam-submit-btn{min-height:44px;}
    .essay-col{min-width:0;}
    .plan-row input[type=number]{width:100%;max-width:120px;min-height:44px;}
  }
</style>
</head>

<header>
  <h1>국가자격시험 AI 학습 프로그램</h1>

</footer>

   ---------------------------------------------------------------------
   각 자격증(cert) 객체 구조:
   {
     id: '고유id',
     name: '표시 이름',
     stageLabels: ['필기','실기']  // 시험 단계 이름 (자격증마다 다름)
     stages: {
        '필기': [ subject, subject, ... ],
        '실기': [ subject, subject, ... ]
     }
   }

   {
     id:'고유id', name:'과목명',
     memorize: [ {id, front, back} ... ],       // 필수 암기사항 카드

     freq:     [ questionObj ... ]                // 출제빈도 TOP 문제

function qcard(id, q, choices, answerIndex, explain, meta){
  return Object.assign({id, q, choices, answerIndex, explain}, meta||{});
}

function essayCard(id, prompt, modelAnswer, meta){
  return Object.assign({id, q: prompt, explain: modelAnswer, isEssay: true}, meta||{});
}

// 소방유체역학 (기계분야 필기)
function fm2_fluidMech(id, name){
  return {
    id, name,
    memorize: [
      {id:id+'-m1', front:'베르누이 방정식', back:'유체 흐름에서 압력수두 + 속도수두 + 위치수두의 합은 일정하다 (에너지 보존). 소방펌프의 양정 계산 문제의 기본 이론.'},
      {id:id+'-m2', front:'연속방정식(질량보존)', back:'배관 단면적 A와 유속 v의 곱(A×v)은 배관 어느 지점에서나 일정하다(비압축성 유체 기준). 배관 구경이 좁아지면 유속이 빨라진다는 원리.'},
      {id:id+'-m3', front:'레이놀즈수(Reynolds Number)', back:'관성력과 점성력의 비로, 값이 작으면 층류, 크면 난류로 판별하는 무차원수. 판별 기준값(임계 레이놀즈수)은 배관 조건에 따라 시험에서 제시되는 경우가 많아 개념(층류/난류 판별 용도) 위주로 암기 권장.'},
      {id:id+'-m4', front:'공동현상(Cavitation)', back:'펌프 흡입측 압력이 포화증기압보다 낮아져 기포가 발생했다가 급격히 소멸하며 소음·진동·펌프손상을 일으키는 현상. 흡입양정을 낮추거나 흡입배관을 짧게 하는 것이 방지대책.'},
      {id:id+'-m5', front:'수격현상(Water Hammer)', back:'배관 내 유체의 흐름을 급격히 차단할 때 압력파가 발생해 배관에 충격을 주는 현상. 완폐형 밸브 사용, 서지탱크 설치 등이 대표적 방지대책.'},
      {id:id+'-m6', front:'펌프의 전양정 개념', back:'전양정 = 실양정(흡입양정+토출양정) + 배관마찰손실수두 + 속도수두 등 손실의 합. 소방펌프 선정 계산 문제의 기본 틀.'},

// 연소공학
function ae2_combustion(id, name){
  return {
    id, name,
    memorize: [
      {id:id+'-m1', front:'이론공기량 / 실제공기량 / 공기비', back:'이론공기량: 연료를 완전연소시키는 데 이론적으로 필요한 최소 공기량. 실제공기량: 실제 공급되는 공기량(불완전연소 방지를 위해 이론공기량보다 많이 공급). 공기비(m) = 실제공기량 ÷ 이론공기량 (통상 1보다 큼).'},
      {id:id+'-m2', front:'완전연소와 불완전연소 생성물', back:'완전연소 시 CO2, H2O가 주로 생성됨. 불완전연소 시 CO, 매연(그을음), 미연소 탄화수소 등이 발생하며 대기오염 및 에너지 손실의 원인이 됨.'},
      {id:id+'-m3', front:'발열량(고위발열량/저위발열량)', back:'고위발열량(총발열량): 연소 시 발생하는 수증기의 응축잠열을 포함한 발열량. 저위발열량(진발열량): 수증기 잠열을 제외한 발열량. 실제 설비 설계에는 저위발열량을 주로 사용.'},
      {id:id+'-m4', front:'매연(그을음) 발생 원인', back:'공기 공급 부족(공기비가 너무 낮음), 연소온도 부족, 연료와 공기의 혼합 불량 등이 주요 원인. 공기비를 적절히 높이면 매연 저감에 도움이 되나, 지나치면 열손실과 NOx 증가를 유발할 수 있음.'},
      {id:id+'-m5', front:'연소의 3요소(연소공학 관점)', back:'가연물(연료), 산소공급원(공기), 점화원(온도). 소방원론의 연소 3요소와 같은 개념이지만, 연소공학에서는 여기에 연소효율·공기비 계산이 추가로 결합되어 출제됨.'},

// 대기오염방지기술
function ae3_prevention(id, name){
  return {
    id, name,
    memorize: [
      {id:id+'-m1', front:'집진장치의 종류', back:'중력집진장치(자체 무게로 침강), 원심력집진장치(사이클론, 회전운동으로 분리), 전기집진장치(전기력으로 대전된 입자 포집, 미세입자에 효과적), 여과집진장치(백필터, 필터에 통과시켜 포집), 세정집진장치(액체로 세정하며 포집, 가스상 오염물질도 일부 제거 가능). 원리와 적용 입자크기를 구분해서 암기.'},
      {id:id+'-m2', front:'집진효율의 개념', back:'집진장치 입구 농도 대비 출구 농도의 감소 비율로 나타내는 성능 지표. (입구농도-출구농도)/입구농도 × 100(%)의 형태로 계산.'},

// 데이터베이스구축
function ip3_database(id, name){
  return {
    id, name,
    memorize: [
      {id:id+'-m1', front:'정규화(1NF~3NF, BCNF)', back:'제1정규형(1NF): 모든 속성이 원자값. 제2정규형(2NF): 부분함수종속 제거. 제3정규형(3NF): 이행함수종속 제거. BCNF: 결정자가 후보키가 아닌 함수종속 제거. 데이터 중복과 이상현상(삽입·삭제·갱신 이상)을 줄이는 것이 목적.'},
      {id:id+'-m2', front:'키의 종류', back:'후보키: 튜플을 유일하게 식별할 수 있는 최소 속성 집합. 기본키(Primary Key): 후보키 중 선택된 대표키. 외래키(Foreign Key): 다른 테이블의 기본키를 참조하는 속성. 참조무결성 유지에 핵심.'},
      {id:id+'-m3', front:'SQL의 분류(DDL/DML/DCL)', back:'DDL(데이터정의어): CREATE, ALTER, DROP - 테이블 구조 정의. DML(데이터조작어): SELECT, INSERT, UPDATE, DELETE - 데이터 조작. DCL(데이터제어어): GRANT, REVOKE - 권한 관리.'},
      {id:id+'-m4', front:'트랜잭션의 특성(ACID)', back:'원자성(Atomicity, 모두 실행되거나 모두 취소), 일관성(Consistency, 무결성 유지), 고립성(Isolation, 동시 실행 트랜잭션 간 간섭 방지), 지속성(Durability, 완료된 트랜잭션은 영구 반영). 데이터베이스 신뢰성의 핵심 4대 특성.'},
      {id:id+'-m5', front:'인덱스(Index)', back:'테이블 검색 속도를 높이기 위해 특정 컬럼에 대해 만드는 자료구조(보통 B-tree 기반). 검색은 빨라지지만, 인덱스 자체의 저장공간이 필요하고 삽입·수정·삭제 시 인덱스 갱신 비용이 추가로 발생.'},
      {id:id+'-m6', front:'ERD, JOIN 종류, 뷰·트리거', back:'개체-관계다이어그램(ERD): 개체와 관계를 도식화해 DB 구조 설계. INNER JOIN(조건 만족 행만 결합) vs OUTER JOIN. 뷰(View): 실제 데이터 없이 유도된 가상 테이블. 트리거: 특정 이벤트 발생 시 자동 실행되는 DB 객체.'},
      {id:id+'-m7', front:'데드락, 무결성 제약조건, 저장프로시저, 백업·복구', back:'데드락(교착상태): 트랜잭션들이 서로 자원을 기다리며 무한 대기. 개체무결성(기본키는 NULL·중복 불가) vs 참조무결성(외래키는 참조 테이블의 기본키 값이거나 NULL). 저장프로시저: SQL 묶음을 저장해두고 호출 실행. 복구(Recovery): 장애 시 정상 상태로 되돌림.'},
      {id:id+'-m8', front:'NoSQL, 정규화 이상현상, 샤딩, 서브쿼리, 데이터사전', back:'NoSQL: 고정 스키마 없이 대용량 비정형 데이터 유연 저장. 이상현상: 삽입이상(속성 부재로 삽입 불가), 삭제이상(원치 않는 정보 동반삭제), 갱신이상(중복데이터 일부만 수정되어 불일치). 샤딩(파티셔닝): 데이터를 여러 서버로 분산 저장. 서브쿼리: SQL 안의 또 다른 SELECT문. 데이터사전: 테이블·컬럼 등 메타데이터 저장 시스템 카탈로그.'}
    ],
    trend: [

/* =====================================================================
   2) 오답노트 저장 (localStorage, 오프라인 - 인터넷 연결 불필요)
========================================================================= */
const STORE_KEY = 'qnetStudyAppRecords_v1';
function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveRecords(r){ localStorage.setItem(STORE_KEY, JSON.stringify(r)); }
let RECORDS = loadRecords();

function recordAnswer(qid, isCorrect){
  RECORDS[qid] = { lastResult: isCorrect ? 'correct' : 'wrong', ts: Date.now() };
  saveRecords(RECORDS);
}
function getStatus(qid){
  return RECORDS[qid] ? RECORDS[qid].lastResult : 'new';
}

/* =====================================================================
   3) 상태 및 렌더링
========================================================================= */
let state = { certId: DATA.certs[0].id, stage: null, subjectId: null, mode: 'memorize', flashIndex: 0, wrongOnly:false,
  examSubjectKey: null, examStarted: false, examSubmitted: false, examAnswers: {}, examQuestions: [] };

function findCert(id){ return DATA.certs.find(c=>c.id===id); }
function currentCert(){ return findCert(state.certId); }
function currentSubjects(){
  const cert = currentCert();
  if(!state.stage) state.stage = cert.stageLabels[0];
  return cert.stages[state.stage] || [];
}
function currentSubject(){
  const subs = currentSubjects();
  if(!state.subjectId && subs.length) state.subjectId = subs[0].id;
  return subs.find(s=>s.id===state.subjectId);
}

function allQuestionsFlat(){
  // 전체 자격증/과목 통합 오답노트용
  let list = [];
  DATA.certs.forEach(c=>{
    c.stageLabels.forEach(st=>{
      (c.stages[st]||[]).forEach(s=>{
        ['trend','mock','freq'].forEach(m=>{
          s[m].forEach(q=> list.push(Object.assign({certName:c.name, stage:st, subjectName:s.name, mode:m}, q)));
        });
      });
    });
  });
  return list;
}

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  let html = `<button class="global-btn" onclick="showGlobalWrongNote()">📕 전체 통합 오답노트 보기</button>`;
  html += `<h2>자격증 선택</h2>`;
  DATA.certs.forEach(c=>{
    const active = c.id===state.certId ? 'active' : '';
    html += `<button class="cert-btn ${active}" onclick="selectCert('${c.id}')">${c.name}<small>${c.stageLabels.join(' / ')}</small></button>`;
  });
  sb.innerHTML = html;
}

function selectCert(id){
  state.certId = id; state.stage = null; state.subjectId = null; state.mode='memorize'; state.wrongOnly=false;
  renderAll();
}

function renderAll(){
  renderSidebar();
  renderMain();
}

function renderMain(){
  const main = document.getElementById('main');
  const cert = currentCert();
  const subs = currentSubjects();
  const subject = currentSubject();

  let html = `<div class="breadcrumb">${cert.name} &gt; ${state.stage}</div>`;

  html += `<div class="type-tabs">`;
  cert.stageLabels.forEach(st=>{
    const active = st===state.stage ? 'active':'';
    html += `<button class="tab-btn ${active}" onclick="selectStage('${st.replace(/'/g,"\\'")}')">${st}</button>`;
  });
  html += `</div>`;

  html += `<div class="subject-tabs">`;
  subs.forEach(s=>{
    const active = s.id===state.subjectId ? 'active':'';
    html += `<button class="tab-btn ${active}" onclick="selectSubject('${s.id}')">${s.name}</button>`;
  });
  html += `</div>`;

  if(!subject){ main.innerHTML = html + `<div class="placeholder-box">이 단계에는 아직 등록된 과목이 없습니다.</div>`; return; }

  html += `<h2 class="subject-title">${subject.name}</h2>`;

    } else {

    }
  }
  if(cert.id==='hvac-eng' && state.stage==='실기' && totalQ>0){
    html += `<div class="warn-box">공조냉동기계기사의 실기는 필답형 100%(계산·서술형)이며 객관식이 아닙니다. 아래 문제는 계산 흐름과 공식을 점검하는 자가진단용 4지선다이며, 실전 준비는 반드시 손으로 직접 계산 과정을 써보는 연습을 병행하세요.</div>`;
  }
  if(cert.id==='electrical-eng' && state.stage==='실기' && totalQ>0){
    html += `<div class="warn-box">전기기사의 실기는 필답형 위주(계산·서술형)이며 객관식이 아닙니다. 아래 문제는 계산 흐름과 공식을 점검하는 자가진단용 4지선다이며, 실전 준비는 반드시 손으로 직접 계산 과정을 써보는 연습을 병행하세요.</div>`;
  }
  if(cert.id==='bigdata-eng' && state.stage==='실기' && totalQ>0){
    html += `<div class="warn-box">빅데이터분석기사의 실기는 객관식이 아니라 Python(또는 R) 환경에서 데이터 전처리→모형 구축→평가를 직접 코드로 수행하는 작업형 시험입니다. 아래 문제는 함수·개념 점검용 자가진단 4지선다이며, 실전 준비는 반드시 실습 환경에서 직접 코드를 작성하는 연습을 병행하세요.</div>`;

    <button class="tab-btn ${state.mode==='memorize'?'active':''}" onclick="selectMode('memorize')">필수 암기사항</button>

function selectStage(st){ state.stage = st; state.subjectId=null; state.mode='memorize'; renderAll(); }
function selectSubject(id){ state.subjectId = id; state.mode='memorize'; renderAll(); }

/* ---------- 필승 합격 (목표일까지 하루 N문제 학습 플랜) ---------- */
const PLAN_KEY = 'qnetStudyAppPlans_v1';
function loadPlans(){ try{ return JSON.parse(localStorage.getItem(PLAN_KEY)) || {}; }catch(e){ return {}; } }
function savePlans(p){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify(p)); }catch(e){} }
function ymd(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parseYmd(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
function planKey(){ const c=currentCert(), s=currentSubject(); return (c&&s) ? c.id+'|'+s.id : null; }

function todaySet(plan, pool){
  const per = Math.min(plan.perDay, pool.length);
  const dayIdx = Math.max(0, daysBetween(plan.startDate, ymd(new Date())));
  const set = [];
  for(let k=0;k<per;k++){ set.push(pool[(dayIdx*per+k)%pool.length]); }
  return {set, per, dayIdx, round: Math.floor(dayIdx*per/pool.length)+1};
}

function planProgressText(plan, setIds){
  const done = (plan.done && plan.done[ymd(new Date())]) || [];
  const n = setIds.filter(id=>done.includes(id)).length;
  return n + ' / ' + setIds.length + '문항 완료' + (n===setIds.length && n>0 ? ' 🎉 오늘 목표 달성!' : '');
}

function markPlanDone(qid){
  if(state.mode!=='plan') return;
  const key = planKey(); if(!key) return;
  const plans = loadPlans(); const plan = plans[key]; if(!plan) return;
  const today = ymd(new Date());
  plan.done = plan.done || {};
  const arr = plan.done[today] || [];
  if(!arr.includes(qid)) arr.push(qid);
  plan.done[today] = arr;
  savePlans(plans);
  const pool = dedupeQuestions(currentSubject());
  const ids = todaySet(plan, pool).set.map(q=>q.id);
  const el = document.getElementById('plan-progress');
  if(el) el.textContent = planProgressText(plan, ids);
}

function savePlan(){
  const key = planKey(); const subject = currentSubject(); if(!key||!subject) return;
  const pool = dedupeQuestions(subject);
  const date = document.getElementById('plan-date').value;
  let per = parseInt(document.getElementById('plan-per').value,10);
  const today = ymd(new Date());
  if(!date || daysBetween(today,date)<0){ alert('목표 시험 날짜를 오늘 이후로 선택해 주세요.'); return; }
  if(!per || per<1){ alert('하루에 풀 문제 수를 1 이상으로 입력해 주세요.'); return; }
  if(per>pool.length) per = pool.length;
  const plans = loadPlans();
  const old = plans[key];
  plans[key] = {targetDate:date, perDay:per, startDate:today, done:(old&&old.done)||{}};
  savePlans(plans);
  state.planEditing = null;
  renderAll();
}
function editPlan(){ state.planEditing = planKey(); renderAll(); }
function deletePlan(){
  if(!confirm('이 과목의 필승 합격 플랜을 삭제할까요? (문제 풀이 기록은 유지됩니다)')) return;
  const plans = loadPlans(); delete plans[planKey()]; savePlans(plans); state.planEditing=null; renderAll();
}

function renderPlanMode(subject){
  const body = document.getElementById('modeBody');
  const pool = dedupeQuestions(subject);
  if(pool.length===0){ body.innerHTML = '<div class="empty-state">이 과목에는 아직 등록된 문제가 없어 학습 플랜을 만들 수 없습니다.</div>'; return; }
  const key = planKey();
  const plans = loadPlans();
  const plan = plans[key];
  const today = ymd(new Date());

  if(!plan || state.planEditing===key){
    const defDate = plan ? plan.targetDate : '';
    const defPer = plan ? Math.min(plan.perDay,pool.length) : Math.min(5,pool.length);
    body.innerHTML = `<div class="plan-box">
      <h3>🎯 필승 합격 플랜 만들기 - ${subject.name}</h3>
      <div class="plan-row"><label>목표 시험 날짜 <input type="date" id="plan-date" min="${today}" value="${defDate}"></label></div>
      <div class="plan-row"><label>하루에 풀 문제 수 <input type="number" id="plan-per" min="1" max="${pool.length}" value="${defPer}"> 문항 (최대 ${pool.length})</label></div>
      <button class="plan-start-btn" onclick="savePlan()">필승 합격 시작</button>
      ${plan ? '<button class="reset-btn" style="margin-left:8px" onclick="state.planEditing=null;renderAll()">취소</button>' : ''}
      <div class="plan-note">설정하면 오늘부터 목표일까지 매일 정해진 문제가 자동으로 배정됩니다. 풀이 후 해설을 바로 확인할 수 있고, 진행 상황은 이 브라우저에 저장됩니다.</div>
    </div>`;
    return;
  }

  const dLeft = daysBetween(today, plan.targetDate);
  if(dLeft<0){
    body.innerHTML = `<div class="plan-box"><h3>목표일(${plan.targetDate})이 지났습니다</h3>
      <div class="plan-note">시험을 보셨나요? 새 목표일로 플랜을 다시 만들어 이어서 학습할 수 있습니다.</div>
      <div style="margin-top:12px"><button class="plan-start-btn" onclick="editPlan()">새 플랜 만들기</button>
      <button class="reset-btn" style="margin-left:8px" onclick="deletePlan()">플랜 삭제</button></div></div>`;
    return;
  }

  const t = todaySet(plan, pool);
  const ids = t.set.map(q=>q.id);
  const totalDays = dLeft+1;
  const totalQ = totalDays*t.per;
  const rounds = (totalQ/pool.length).toFixed(1);
  let cum = 0; Object.keys(plan.done||{}).forEach(d=>{ cum += plan.done[d].length; });
  const ddayLabel = dLeft===0 ? 'D-Day' : 'D-'+dLeft;

  let html = `<div class="plan-box">
    <h3>🎯 필승 합격 - ${subject.name}</h3>
    <div class="plan-stats">
      <div class="plan-stat">목표일<b>${plan.targetDate}</b></div>
      <div class="plan-stat">남은 기간<b class="plan-dday">${ddayLabel}</b></div>
      <div class="plan-stat">하루 목표<b>${t.per}문항</b></div>
      <div class="plan-stat">오늘 진행<b id="plan-progress">${planProgressText(plan, ids)}</b></div>
      <div class="plan-stat">누적 풀이<b>${cum}문항</b></div>
    </div>
    <div class="plan-note">목표일까지 총 ${totalDays}일 × ${t.per}문항 = ${totalQ}문항 학습 예정 (이 과목 문제은행 ${pool.length}문항 기준 약 ${rounds}회독). 오늘은 ${t.round}회독째 문제입니다.<br>
    문제은행이 과목당 ${pool.length}문항이라 기간이 길면 같은 문제를 반복하게 됩니다. 문제는 큐넷 기출 원문이 아니라 출제기준 기반으로 재구성한 문제입니다.</div>
    <div style="margin-top:10px"><button class="reset-btn" onclick="editPlan()">플랜 수정</button>
    <button class="reset-btn" style="margin-left:6px" onclick="deletePlan()">플랜 삭제</button></div>
  </div>`;
  html += `<h3 style="font-size:.95rem;margin:14px 0 8px;color:var(--navy)">📅 오늘의 문제 (${today})</h3>`;
  html += t.set.map(q=>questionCardHtml(q)).join('');
  body.innerHTML = html;
}

/* ---------- 암기카드 ---------- */
function renderFlashcards(subject){
  const body = document.getElementById('modeBody');
  if(subject.memorize.length===0){ body.innerHTML = `<div class="empty-state">등록된 암기카드가 없습니다.</div>`; return; }
  if(state.flashIndex >= subject.memorize.length) state.flashIndex = 0;
  const card = subject.memorize[state.flashIndex];
  body.innerHTML = `
    <div class="card flash-wrap">
      <div class="flash" id="flashFace" onclick="flipFlash()">${card.front}</div>
    </div>
    <div class="flash-nav">
      <button onclick="moveFlash(-1)">◀ 이전</button>
      <span class="flash-counter">${state.flashIndex+1} / ${subject.memorize.length} (클릭하면 뒷면 표시)</span>
      <button onclick="moveFlash(1)">다음 ▶</button>
    </div>`;
  document.getElementById('flashFace').dataset.showing = 'front';
}
function flipFlash(){
  const subject = currentSubject();
  const card = subject.memorize[state.flashIndex];
  const face = document.getElementById('flashFace');
  if(face.dataset.showing==='front'){ face.textContent = card.back; face.dataset.showing='back'; }
  else { face.textContent = card.front; face.dataset.showing='front'; }
}
function moveFlash(dir){
  const subject = currentSubject();
  state.flashIndex = (state.flashIndex + dir + subject.memorize.length) % subject.memorize.length;
  renderFlashcards(subject);
}

/* ---------- 실전 모의고사 (기출유형+모의고사+빈도TOP 문제를 중복 없이 모아 시험처럼 응시) ---------- */

// 자격증별 "실제 시험 문항수" 참고표 (필기, 4지선다/5지선다 객관식 과목 기준).
// 국가기술자격 기사/산업기사 필기는 대부분 "과목당 20문항"이 표준입니다.
// 서술형·작업형(기술사, 지도사 2차, 손해평가사 2차, AICE/빅데이터분석기사 실기 등)은
// 애초에 "문항수"로 채점하는 방식이 아니라서 이 표에 넣지 않았습니다.
// 정확한 최신 문항수는 항상 시행처(큐넷/K-DATA 등) 최신 공고로 재확인하세요.

  'ae-1':20,'ae-2':20,'ae-3':20,'ae-4':20,'ae-5':20,
  // 건설안전기사 필기 5과목
  'cs-1':20,'cs-2':20,'cs-3':20,'cs-4':20,'cs-5':20,
  // 산업안전기사 필기 6과목
  'isa-1':20,'isa-2':20,'isa-3':20,'isa-4':20,'isa-5':20,'isa-6':20,
  // 공조냉동기계기사 필기 4과목

  'bd-1':20,'bd-2':20,'bd-3':20,'bd-4':20,
  // 정보처리기사 필기 5과목
  'ip-1':20,'ip-2':20,'ip-3':20,'ip-4':20,'ip-5':20
};

function dedupeQuestions(subject){
  const seen = new Set();
  const pool = [];
  ['trend','mock','freq'].forEach(m=>{
    subject[m].forEach(q=>{
      if(!seen.has(q.id)){ seen.add(q.id); pool.push(q); }
    });
  });
  return pool;
}

function renderExamMode(subject){
  const body = document.getElementById('modeBody');
  const pool = dedupeQuestions(subject);
  const realCount = EXAM_REAL_COUNTS[subject.id];

  // 과목이 바뀌면 이전 시험 진행상태 초기화
  if(state.examSubjectKey !== subject.id){
    state.examSubjectKey = subject.id;
    state.examStarted = false;
    state.examSubmitted = false;
    state.examAnswers = {};
    state.examQuestions = [];
  }

  if(pool.length===0){
    body.innerHTML = `<div class="empty-state">이 과목에는 아직 등록된 문제가 없어 실전 모의고사를 만들 수 없습니다.</div>`;
    return;
  }

  // 논술·면접·서술형 과목은 객관식 채점이 성립하지 않으므로,
  // 점수 매기는 시험 모드 대신 문제를 직접 써보고 모범답안과 비교하는 화면을 그대로 보여줌.
  if(pool[0].isEssay){
    body.innerHTML = `<div class="exam-intro" style="text-align:left;">
        <h3 style="text-align:center;">${subject.name} - 서술형 자가학습</h3>
        <p style="text-align:center;">이 과목은 논술·면접·서술형이라 객관식 채점이 성립하지 않습니다. 아래 문제마다 직접 답안을 작성한 뒤 "모범답안과 비교하기"를 눌러 스스로 확인해보세요.</p>
      </div>` + pool.map(q=>questionCardHtml(q)).join('');
    return;
  }

  if(!state.examStarted){
    let countNote;
    if(realCount){
      if(pool.length >= realCount){
        countNote = `이 과목의 실제 시험 문항수(${realCount}문항) 이상이 준비되어 있어, 등록된 <b>총 ${pool.length}문항</b> 전체로 응시합니다.`;
      } else {
        countNote = `실제 시험은 이 과목당 <b>${realCount}문항</b>이지만, 현재 이 앱에는 <b>${pool.length}문항</b>만 준비되어 있어 그만큼으로 응시합니다. 부족한 문항은 순차적으로 채워나갈 예정입니다.`;
      }
    } else {
      countNote = `이 과목에 등록된 <b>총 ${pool.length}문항</b>으로 응시합니다. (이 자격증은 서술형·작업형 등 실제 시험이 객관식 문항수 기준이 아니거나, 정확한 실제 문항수를 아직 확인하지 못했습니다)`;
    }
    body.innerHTML = `
      <div class="exam-intro">
        <h3>실전 모의고사 - ${subject.name}</h3>
        <p>이 과목에 등록된 기출유형·모의고사·출제빈도TOP 문제를 중복 없이 모두 모았습니다.<br>${countNote}<br>
        문제를 다 풀지 않아도 언제든 채점할 수 있습니다.</p>
        <button class="exam-start-btn" onclick="startExam()">시험 시작</button>
      </div>`;
    return;
  }

  if(state.examStarted && !state.examSubmitted){
    const answeredCount = Object.keys(state.examAnswers).length;
    let html = `<div class="exam-progress">
      <span>${subject.name} 실전 모의고사</span>
      <span>${answeredCount} / ${state.examQuestions.length}문항 응시</span>
    </div>`;
    html += state.examQuestions.map((q,qi)=>{
      const selected = state.examAnswers[q.id];
      return `<div class="card">
        <span class="q-tag">${qi+1}번</span>
        <div class="q-text">${q.q}</div>
        ${q.choices.map((c,i)=>`<button class="choice ${selected===i?'exam-selected':''}" onclick="selectExamAnswer('${q.id}', ${i})">${String.fromCharCode(9312+i)} ${c}</button>`).join('')}
      </div>`;
    }).join('');
    html += `<div style="text-align:center;margin:18px 0;">
      <button class="exam-submit-btn" onclick="submitExam()">채점하기 (${answeredCount}/${state.examQuestions.length}문항 응시함)</button>
    </div>`;
    body.innerHTML = html;
    return;
  }

  // 채점 완료 화면
  const total = state.examQuestions.length;
  let correctCount = 0;
  state.examQuestions.forEach(q=>{ if(state.examAnswers[q.id]===q.answerIndex) correctCount++; });
  const score = Math.round((correctCount/total)*1000)/10;
  const passed = score >= 60;

  let html = `<div class="exam-result-banner ${passed?'pass':'fail'}">
    <div>총 ${total}문항 중 ${correctCount}개 정답</div>
    <div class="score-num">${score}점</div>
    <div class="pf-label">${passed?'합격 추정':'불합격 추정'}</div>
    <div class="exam-note">일반적인 국가기술자격 평균 60점 기준으로 간이 판정한 것입니다. 실제 시험은 자격증마다 과목별 최소점수(예: 40점) 등 세부 합격기준이 다를 수 있으니 참고용으로만 확인하세요.</div>
  </div>`;
  html += `<div style="text-align:center;margin-bottom:16px;"><button class="reset-btn" onclick="retakeExam()">다시 응시하기</button></div>`;
  html += state.examQuestions.map((q,qi)=>{
    const userIdx = state.examAnswers[q.id];
    const isCorrect = userIdx===q.answerIndex;
    return `<div class="card">
      <span class="q-tag">${qi+1}번 · ${isCorrect?'정답':(userIdx===undefined?'미응시':'오답')}</span>
      <div class="q-text">${q.q}</div>
      ${q.choices.map((c,i)=>{
        let cls='choice';
        if(i===q.answerIndex) cls+=' correct';
        else if(i===userIdx) cls+=' wrong';
        return `<button class="${cls}" disabled>${String.fromCharCode(9312+i)} ${c}</button>`;
      }).join('')}
      <div class="explain show">${q.diagram ? `<div class="diagram-box">${q.diagram}</div>` : ''}${q.explain}</div>
    </div>`;
  }).join('');
  body.innerHTML = html;
}

function startExam(){
  const subject = currentSubject();
  const pool = dedupeQuestions(subject);
  state.examQuestions = pool;
  state.examAnswers = {};
  state.examStarted = true;
  state.examSubmitted = false;
  renderAll();
}

function selectExamAnswer(qid, idx){
  state.examAnswers[qid] = idx;
  renderMain();
}

function submitExam(){
  state.examQuestions.forEach(q=>{
    const userIdx = state.examAnswers[q.id];
    if(userIdx !== undefined){ recordAnswer(q.id, userIdx===q.answerIndex); }
  });
  state.examSubmitted = true;
  renderAll();
}

function retakeExam(){
  state.examStarted = false;
  state.examSubmitted = false;
  state.examAnswers = {};
  state.examQuestions = [];
  renderAll();
}

/* ---------- 문제 리스트(기출유형/빈도) ---------- */
function renderQuestionList(list, subject){
  const body = document.getElementById('modeBody');
  if(!list || list.length===0){ body.innerHTML = `<div class="empty-state">등록된 문제가 없습니다.</div>`; return; }
  body.innerHTML = list.map(q => questionCardHtml(q)).join('');
}

function questionCardHtml(q){
  if(q.isEssay) return essayCardHtml(q);
  const status = getStatus(q.id);
  const statusLabel = status==='wrong' ? '오답' : status==='correct' ? '정답' : '미풀이';
  const metaBits = [];
  if(q.year) metaBits.push(q.year);
  if(q.freq) metaBits.push('출제빈도 '+q.freq);
  return `
  <div class="card" id="qc-${q.id}">
    ${metaBits.length? `<span class="q-tag">${metaBits.join(' · ')}</span>` : ''}
    <div class="q-text">${q.q}</div>
    ${q.choices.map((c,i)=>`<button class="choice" id="ch-${q.id}-${i}" onclick="answer('${q.id}', ${i})">${String.fromCharCode(9312+i)} ${c}</button>`).join('')}
    <div class="explain" id="ex-${q.id}">${q.diagram ? `<div class="diagram-box">${q.diagram}</div>` : ''}${q.explain}</div>
    <div class="q-footer">
      <span class="status-pill ${status}" id="st-${q.id}">${statusLabel}</span>
      <button class="reset-btn" id="rev-${q.id}" onclick="showAnswer('${q.id}')">정답/해설 보기</button>
    </div>
  </div>`;
}

// 논술/면접/서술형 문제 카드: 직접 답안을 작성한 뒤 모범답안과 비교
function essayCardHtml(q){
  const metaBits = [];
  if(q.year) metaBits.push(q.year);
  if(q.freq) metaBits.push('출제빈도 '+q.freq);
  return `
  <div class="card" id="qc-${q.id}">
    ${metaBits.length? `<span class="q-tag">${metaBits.join(' · ')}</span>` : ''}
    <div class="essay-badge">✍️ 서술형 · 직접 답안 작성 후 비교</div>
    <div class="q-text">${q.q}</div>
    <textarea class="essay-textarea" id="essay-input-${q.id}" placeholder="이 문제에 대한 답안을 여기에 직접 작성해보세요. (작성하지 않고 바로 모범답안만 확인할 수도 있습니다)"></textarea>
    <div class="q-footer">
      <span class="status-pill new" id="st-${q.id}">자가학습</span>
      <button class="reset-btn" id="rev-${q.id}" onclick="showModelAnswer('${q.id}')">모범답안과 비교하기</button>
    </div>
    <div class="essay-compare" id="ex-${q.id}">
      <div class="essay-col essay-col-mine">
        <div class="essay-col-title">✏️ 내가 쓴 답안</div>
        <div class="essay-col-body" id="myanswer-view-${q.id}"></div>
      </div>
      <div class="essay-col essay-col-model">
        <div class="essay-col-title">📘 모범답안</div>
        <div class="essay-col-body">${q.diagram ? `<div class="diagram-box">${q.diagram}</div>` : ''}${q.explain}</div>
      </div>
    </div>
  </div>`;
}

function showModelAnswer(qid){
  const q = allQuestionsFlat().find(x=>x.id===qid) || findInCurrentSubject(qid);
  if(!q) return;
  markPlanDone(qid);
  const textarea = document.getElementById(`essay-input-${qid}`);
  const myAnswer = textarea ? textarea.value.trim() : '';
  const viewEl = document.getElementById(`myanswer-view-${qid}`);
  if(viewEl){
    viewEl.textContent = myAnswer || '(답안을 작성하지 않고 모범답안을 먼저 확인했습니다. 다음엔 먼저 써본 뒤 비교해보세요!)';
  }
  const compareEl = document.getElementById(`ex-${qid}`);
  if(compareEl) compareEl.classList.add('show');
  const pill = document.getElementById(`st-${qid}`);
  if(pill){ pill.textContent = '비교완료'; pill.className = 'status-pill correct'; }
  const revBtn = document.getElementById(`rev-${qid}`);
  if(revBtn) revBtn.style.display = 'none';
  if(textarea) textarea.readOnly = true;
}

function answer(qid, idx){
  // 문제 데이터 찾기 (전체에서 탐색)
  const q = allQuestionsFlat().find(x=>x.id===qid) || findInCurrentSubject(qid);
  if(!q) return;
  markPlanDone(qid);
  const correctIdx = q.answerIndex;
  for(let i=0;i<q.choices.length;i++){
    const el = document.getElementById(`ch-${qid}-${i}`);
    if(!el) continue;
    el.onclick = null;
    if(i===correctIdx) el.classList.add('correct');
    else if(i===idx) el.classList.add('wrong');
  }
  document.getElementById(`ex-${qid}`).classList.add('show');
  const isCorrect = idx===correctIdx;
  recordAnswer(qid, isCorrect);
  const pill = document.getElementById(`st-${qid}`);
  pill.textContent = isCorrect ? '정답' : '오답';
  pill.className = 'status-pill ' + (isCorrect?'correct':'wrong');
  const revBtn = document.getElementById(`rev-${qid}`);
  if(revBtn) revBtn.style.display = 'none';
}

// 채점과 별개로, 정답과 해설만 바로 확인하고 싶을 때 쓰는 버튼.
// 이 버튼을 눌러서 보는 것은 "풀이 시도"로 채점되지 않으므로 오답노트 상태는 바뀌지 않습니다.
function showAnswer(qid){
  const q = allQuestionsFlat().find(x=>x.id===qid) || findInCurrentSubject(qid);
  if(!q) return;
  markPlanDone(qid);
  for(let i=0;i<q.choices.length;i++){
    const el = document.getElementById(`ch-${qid}-${i}`);
    if(!el) continue;
    el.onclick = null;
    if(i===q.answerIndex) el.classList.add('correct');
  }
  document.getElementById(`ex-${qid}`).classList.add('show');
  const revBtn = document.getElementById(`rev-${qid}`);
  if(revBtn) revBtn.style.display = 'none';
}

function findInCurrentSubject(qid){
  const subject = currentSubject();
  if(!subject) return null;
  return ['trend','mock','freq'].map(m=>subject[m]).flat().find(x=>x.id===qid);
}

/* ---------- 오답노트 (과목별) ---------- */
function renderWrongForSubject(subject){
  const body = document.getElementById('modeBody');
  const all = ['trend','mock','freq'].map(m=>subject[m]).flat();
  const wrong = all.filter(q=> getStatus(q.id)==='wrong');
  if(wrong.length===0){ body.innerHTML = `<div class="empty-state">현재 이 과목에는 오답으로 표시된 문제가 없습니다. (문제를 풀고 틀리면 여기 자동으로 모입니다)</div>`; return; }
  body.innerHTML = `<button class="reset-btn" onclick="clearWrongForSubject()">이 과목 오답 기록 초기화</button>` + wrong.map(q=>questionCardHtml(q)).join('');
}
function clearWrongForSubject(){
  const subject = currentSubject();
  const all = ['trend','mock','freq'].map(m=>subject[m]).flat();
  all.forEach(q=>{ if(RECORDS[q.id]) delete RECORDS[q.id]; });
  saveRecords(RECORDS);
  renderAll();
}

/* ---------- 전체 통합 오답노트 ---------- */
function showGlobalWrongNote(){
  const main = document.getElementById('main');
  const all = allQuestionsFlat();
  const wrong = all.filter(q=>getStatus(q.id)==='wrong');
  let html = `<div class="breadcrumb">전체 통합 오답노트</div>`;
  html += `<h2 class="subject-title">전체 자격증 · 전체 과목 오답 모아보기</h2>`;
  if(wrong.length===0){
    html += `<div class="empty-state">현재 전체 자격증을 통틀어 오답으로 표시된 문제가 없습니다.</div>`;
  } else {
    html += `<div class="score-bar"><div>오답 문제 수: ${wrong.length}개</div></div>`;
    html += wrong.map(q=>`
      <div class="card" id="qc-${q.id}">
        <span class="q-tag">${q.certName} · ${q.stage} · ${q.subjectName}</span>
        <div class="q-text">${q.q}</div>
        ${q.choices.map((c,i)=>`<button class="choice" id="ch-${q.id}-${i}" onclick="answer('${q.id}', ${i})">${String.fromCharCode(9312+i)} ${c}</button>`).join('')}
        <div class="explain" id="ex-${q.id}">${q.diagram ? `<div class="diagram-box">${q.diagram}</div>` : ''}${q.explain}</div>
        <div class="q-footer">
          <span class="status-pill wrong" id="st-${q.id}">오답</span>
          <button class="reset-btn" id="rev-${q.id}" onclick="showAnswer('${q.id}')">정답/해설 보기</button>
        </div>
      </div>`).join('');
  }
  main.innerHTML = html;
}

/* =====================================================================
   4) 초기 실행
========================================================================= */
renderAll();
</script>
